<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- <script type="module" src="../js/profil.js"></script> -->
</head>

<body>
    <header class="w-full h-[80px] text-white sticky top-0 max-sm:h-[120px]">
        <div class="bg-slate-950 flex justify-between items-center h-full px-10 border-b-1 max-sm:flex-col">
            <div class="flex gap-2 items-center max-sm:w-full max-sm:gap-20 max-sm:justify-center">
                <img class="w-[80px]" src="../assets/images/a_clean_vector_style_logo_illustration_on_a_transp.png"
                    alt="DevScope Logo">
                <p>DevScope</p>
            </div>
            <nav>
                <ul class="flex gap-6 items-center max-sm:w-full max-sm:gap-20 max-sm:mb-3">
                    <li class="rounded-md bg-cyan-500 p-2"><a href="../index.html">Recherche</a> </li>
                    <li class="p-2"><a href="./shortlist.html">SchortList</a> </li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="min-h-screen bg-slate-950 px-5 py-10 text-white">

        <section class="mx-auto max-w-5xl rounded-xl border border-slate-800 bg-slate-900 px-6 py-20 text-center">

            <!-- Error Icon -->
            <div
                class="mx-auto mb-6 flex h-20 w-20 items-center justify-center rounded-full border border-red-500 bg-red-500/10">

                <span class="text-4xl font-bold text-red-400">
                    !
                </span>

            </div>

            <!-- Error Message -->
            <h1 class="mb-4 text-2xl font-bold md:text-3xl">
                Aucun développeur trouvé
            </h1>

            <p class="mx-auto max-w-lg text-gray-400">
                Nous n'avons trouvé aucun profil GitHub correspondant
                à ce nom d'utilisateur. Vérifiez votre recherche
                et réessayez.
            </p>

            <!-- Back Button -->
            <a href="../index.html"
                class="mt-8 inline-block rounded-lg bg-cyan-500 px-6 py-3 font-medium text-slate-950 hover:bg-cyan-400">
                Retour à la recherche
            </a>

        </section>

    </main>

</body>
</html>
